ansible_user: ubuntu
ansible_become: true

zabbix_major_version: "7.0"
zabbix_repo_deb: "https://repo.zabbix.com/zabbix/{{ zabbix_major_version }}/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_major_version }}+ubuntu24.04_all.deb"
zabbix_db_host: "10.10.20.20"       # PostgreSQL HA VIP/DNS
zabbix_db_port: 5432
zabbix_db_name: "zabbix"
zabbix_db_user: "zabbix"
zabbix_db_password: "CHANGE_WITH_ANSIBLE_VAULT"
zabbix_frontend_server_name: "zabbix.example.com"
zabbix_timezone: "Asia/Kolkata"
zabbix_ha_failover_delay: "1m"
minimum_memory_mb: 4096
minimum_root_free_gb: 20
required_tcp_ports:
  - 22
  - 10051
